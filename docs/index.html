<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requirements Brief</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="wrap">
    <h1>Requirements Brief</h1>
    <p class="lede">A title and one paragraph for the top-level requirements.</p>
    <form id="brief-form">
      <label for="title">Title</label>
      <input id="title" name="title" required maxlength="180" autocomplete="off" value="DroneResponse">
      <label for="outline">Outline</label>
      <textarea id="outline" name="outline" required maxlength="2000">Drones help a team search for a missing person and carry a needed item to a chosen place. The team starts the mission, the drones fly it, and the team hears what was found and when the job is done.</textarea>
      <p class="hint">Example. Replace this with your own brief.</p>
      <p class="error" id="form-error" role="alert"></p>
      <div class="actions">
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
  <script src="briefs.js"></script>
  <script>
    var titleInput = document.getElementById("title");
    var outlineInput = document.getElementById("outline");
    var formError = document.getElementById("form-error");

    document.getElementById("brief-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var title = titleInput.value.trim();
      var outline = outlineInput.value.trim();
      if (!title || !outline) {
        formError.className = "error";
        formError.textContent = "Add both a title and an outline.";
        return;
      }
      var briefs = loadBriefs();
      briefs.push({ id: createBriefId(), title: title, outline: outline });
      try {
        saveBriefs(briefs);
      } catch (err) {
        formError.className = "error";
        formError.textContent = "This browser blocked local storage, so the brief was not saved.";
        return;
      }
      formError.className = "hint";
      formError.textContent = "Saved.";
    });
  </script>
</body>
</html>
